<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Wireframe of the AWS Transform Settings tab showing the web application URL, IDE start URL and Region">
  <rect width="880" height="420" fill="#ffffff"/>

  <rect x="690" y="10" width="178" height="22" rx="11" fill="#fff4e5" stroke="#d98c00"/>
  <text x="779" y="25" font-size="11" fill="#8a5a00" text-anchor="middle" font-weight="600">WIREFRAME — not a screenshot</text>

  <!-- header -->
  <rect x="12" y="42" width="856" height="40" fill="#232F3E"/>
  <text x="28" y="67" font-size="14" fill="#ffffff" font-weight="700">aws</text>
  <text x="68" y="67" font-size="12" fill="#ffffff">AWS Transform</text>
  <text x="790" y="67" font-size="11" fill="#c8d1dc">us-east-1 ▾</text>

  <!-- left nav (hamburger reveals these) -->
  <rect x="12" y="82" width="170" height="326" fill="#f4f6f8" stroke="#d5dbdb"/>
  <g fill="#232F3E">
    <rect x="28" y="98" width="14" height="2"/><rect x="28" y="104" width="14" height="2"/><rect x="28" y="110" width="14" height="2"/>
  </g>
  <text x="52" y="110" font-size="11" fill="#5a6b7b">menu</text>
  <rect x="12" y="130" width="170" height="28" fill="#e8f0fa"/>
  <rect x="12" y="130" width="3" height="28" fill="#0972d3"/>
  <text x="32" y="149" font-size="12" fill="#0972d3" font-weight="700">Settings</text>
  <text x="32" y="179" font-size="12" fill="#16191f">Users</text>
  <text x="32" y="207" font-size="12" fill="#16191f">Connectors</text>
  <text x="32" y="235" font-size="12" fill="#16191f">Profile</text>

  <!-- main -->
  <text x="202" y="112" font-size="18" fill="#16191f" font-weight="600">Settings</text>
  <text x="202" y="132" font-size="12" fill="#5a6b7b">Copy these three values into your notes — you need them in Parts 3 and 10.</text>

  <!-- URL row 1 -->
  <rect x="202" y="148" width="650" height="62" rx="6" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="218" y="170" font-size="12" fill="#5a6b7b" font-weight="600">Web application URL</text>
  <rect x="218" y="178" width="470" height="22" rx="3" fill="#f4f6f8" stroke="#d5dbdb"/>
  <text x="228" y="193" font-size="11" fill="#0972d3" font-family="monospace">https://transform.&lt;id&gt;.aws/…</text>
  <rect x="700" y="178" width="60" height="22" rx="3" fill="#ffffff" stroke="#8d99a8"/>
  <text x="730" y="193" font-size="10" fill="#16191f" text-anchor="middle">Copy</text>
  <text x="776" y="193" font-size="10" fill="#037f0c" font-weight="600">→ the agentic UI</text>

  <!-- URL row 2 -->
  <rect x="202" y="220" width="650" height="62" rx="6" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="218" y="242" font-size="12" fill="#5a6b7b" font-weight="600">Start URL for IDE</text>
  <rect x="218" y="250" width="470" height="22" rx="3" fill="#f4f6f8" stroke="#d5dbdb"/>
  <text x="228" y="265" font-size="11" fill="#0972d3" font-family="monospace">https://transform.&lt;id&gt;.aws/start</text>
  <rect x="700" y="250" width="60" height="22" rx="3" fill="#ffffff" stroke="#8d99a8"/>
  <text x="730" y="265" font-size="10" fill="#16191f" text-anchor="middle">Copy</text>
  <text x="776" y="265" font-size="10" fill="#037f0c" font-weight="600">→ Kiro / VS Code</text>

  <!-- region -->
  <rect x="202" y="292" width="320" height="52" rx="6" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="218" y="314" font-size="12" fill="#5a6b7b" font-weight="600">Region</text>
  <text x="218" y="334" font-size="12" fill="#16191f" font-family="monospace">us-east-1</text>

  <!-- IAM access toggle -->
  <rect x="534" y="292" width="318" height="52" rx="6" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="550" y="314" font-size="12" fill="#5a6b7b" font-weight="600">Access with IAM credentials</text>
  <rect x="550" y="322" width="34" height="16" rx="8" fill="#0972d3"/>
  <circle cx="576" cy="330" r="6" fill="#ffffff"/>
  <text x="594" y="335" font-size="11" fill="#16191f">Enabled</text>

  <text x="202" y="372" font-size="11" fill="#5a6b7b">Note: by default no users have access until you assign them under Users.</text>
</svg>
