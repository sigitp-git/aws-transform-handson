<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Wireframe of the AWS Transform workspace showing the five job types and the natural language goal prompt">
  <rect width="880" height="520" fill="#ffffff"/>

  <rect x="690" y="10" width="178" height="22" rx="11" fill="#fff4e5" stroke="#d98c00"/>
  <text x="779" y="25" font-size="11" fill="#8a5a00" text-anchor="middle" font-weight="600">WIREFRAME — not a screenshot</text>

  <!-- app chrome -->
  <rect x="12" y="42" width="856" height="38" fill="#232F3E"/>
  <text x="28" y="66" font-size="12" fill="#ffffff" font-weight="700">AWS Transform</text>
  <text x="160" y="66" font-size="11" fill="#c8d1dc">workspace:</text>
  <text x="222" y="66" font-size="11" fill="#FF9900" font-weight="600">learning-transform</text>
  <circle cx="842" cy="61" r="11" fill="#48576b"/>
  <text x="842" y="65" font-size="10" fill="#ffffff" text-anchor="middle">you</text>

  <text x="28" y="108" font-size="18" fill="#16191f" font-weight="600">What do you want to transform?</text>
  <text x="28" y="128" font-size="12" fill="#5a6b7b">Pick a job type, or just describe your goal in the chat box below.</text>

  <!-- job type cards -->
  <!-- 1 Assessment -->
  <rect x="28" y="144" width="264" height="108" rx="6" fill="#ffffff" stroke="#0972d3" stroke-width="2"/>
  <rect x="28" y="144" width="264" height="4" rx="2" fill="#0972d3"/>
  <text x="46" y="174" font-size="13" fill="#16191f" font-weight="700">Assess workloads</text>
  <text x="46" y="194" font-size="11" fill="#5a6b7b">TCO, right-sizing, licensing,</text>
  <text x="46" y="210" font-size="11" fill="#5a6b7b">what-if scenarios, PDF/PPTX</text>
  <rect x="46" y="222" width="52" height="18" rx="9" fill="#e8f5e9"/>
  <text x="72" y="235" font-size="10" fill="#037f0c" text-anchor="middle" font-weight="700">FREE</text>
  <text x="108" y="235" font-size="10" fill="#0972d3" font-weight="600">← start here (Part 2)</text>

  <!-- 2 Custom -->
  <rect x="306" y="144" width="264" height="108" rx="6" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="324" y="174" font-size="13" fill="#16191f" font-weight="700">Custom / code</text>
  <text x="324" y="194" font-size="11" fill="#5a6b7b">Any-to-any code transformation,</text>
  <text x="324" y="210" font-size="11" fill="#5a6b7b">campaigns, MODA, ARA</text>
  <rect x="324" y="222" width="86" height="18" rx="9" fill="#fff4e5"/>
  <text x="367" y="235" font-size="10" fill="#8a5a00" text-anchor="middle" font-weight="700">AGENT-MINUTES</text>
  <text x="420" y="235" font-size="10" fill="#5a6b7b">Parts 3, 5–7</text>

  <!-- 3 Windows -->
  <rect x="584" y="144" width="264" height="108" rx="6" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="602" y="174" font-size="13" fill="#16191f" font-weight="700">Windows / .NET</text>
  <text x="602" y="194" font-size="11" fill="#5a6b7b">.NET Framework → .NET 8+,</text>
  <text x="602" y="210" font-size="11" fill="#5a6b7b">SQL Server, IIS → containers</text>
  <rect x="602" y="222" width="52" height="18" rx="9" fill="#e8f5e9"/>
  <text x="628" y="235" font-size="10" fill="#037f0c" text-anchor="middle" font-weight="700">FREE</text>
  <text x="664" y="235" font-size="10" fill="#5a6b7b">Part 4</text>

  <!-- 4 Mainframe -->
  <rect x="28" y="266" width="264" height="108" rx="6" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="46" y="296" font-size="13" fill="#16191f" font-weight="700">Mainframe (z/OS)</text>
  <text x="46" y="316" font-size="11" fill="#5a6b7b">COBOL / PL-I / JCL → Java, C#,</text>
  <text x="46" y="332" font-size="11" fill="#5a6b7b">VSAM / Db2, equivalence tests</text>
  <rect x="46" y="344" width="52" height="18" rx="9" fill="#e8f5e9"/>
  <text x="72" y="357" font-size="10" fill="#037f0c" text-anchor="middle" font-weight="700">FREE</text>
  <text x="108" y="357" font-size="10" fill="#5a6b7b">Part 8</text>

  <!-- 5 VMware -->
  <rect x="306" y="266" width="264" height="108" rx="6" fill="#ffffff" stroke="#d5dbdb"/>
  <text x="324" y="296" font-size="13" fill="#16191f" font-weight="700">VMware migration</text>
  <text x="324" y="316" font-size="11" fill="#5a6b7b">Discovery, wave planning, LZA,</text>
  <text x="324" y="332" font-size="11" fill="#5a6b7b">network conversion, cutover</text>
  <rect x="324" y="344" width="52" height="18" rx="9" fill="#e8f5e9"/>
  <text x="350" y="357" font-size="10" fill="#037f0c" text-anchor="middle" font-weight="700">FREE</text>
  <text x="386" y="357" font-size="10" fill="#d13212" font-weight="600">⚠ provisioned resources bill</text>

  <!-- empty slot note -->
  <rect x="584" y="266" width="264" height="108" rx="6" fill="#f4f6f8" stroke="#d5dbdb" stroke-dasharray="4 3"/>
  <text x="716" y="312" font-size="11" fill="#8d99a8" text-anchor="middle">Same five agents are also reachable</text>
  <text x="716" y="330" font-size="11" fill="#8d99a8" text-anchor="middle">from CLI, Kiro, VS, skills, MCP</text>

  <!-- chat box -->
  <rect x="28" y="396" width="820" height="56" rx="6" fill="#ffffff" stroke="#0972d3"/>
  <text x="46" y="422" font-size="12" fill="#8d99a8" font-style="italic">Describe your goal… e.g. "Assess the servers in this inventory and build a TCO case"</text>
  <rect x="760" y="408" width="74" height="30" rx="4" fill="#FF9900"/>
  <text x="797" y="428" font-size="12" fill="#16191f" text-anchor="middle" font-weight="700">Send</text>

  <text x="28" y="478" font-size="11" fill="#5a6b7b">Worklogs record every agent action and every human approval — that is your audit trail.</text>
  <text x="28" y="498" font-size="11" fill="#5a6b7b">Workspace roles (Admin / Contributor / Approver / Read-only) govern what you can do here.</text>
</svg>
